<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOX Bar – Visitenkarten (85 × 55 mm, 10 pro A4)</title>
<style>
  :root{
    --bg:#0B0720; --surface:#25134D; --accent:#6A2FCB;
    --glow:#9D71E8; --light:#D1B8FF; --lightest:#F2E9FF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Inter",Arial,sans-serif;background:#1b1b22;padding:32px 16px;display:flex;flex-direction:column;align-items:center;gap:18px;}
  .toolbar{color:var(--lightest);font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .toolbar button{background:linear-gradient(135deg,var(--accent),var(--glow));color:#fff;border:none;border-radius:999px;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 0 18px rgba(157,113,232,.5);}
  .toolbar button:hover{filter:brightness(1.15);}
  .sheet{
    width:210mm;height:297mm;background:#fff;padding:5mm;
    display:grid;grid-template-columns:repeat(2,85mm);grid-template-rows:repeat(5,55mm);
    gap:7mm 10mm;justify-content:center;align-content:center;
    box-shadow:0 25px 70px rgba(0,0,0,.6);
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .card{
    width:85mm;height:55mm;position:relative;overflow:hidden;
    border:1px dashed rgba(157,113,232,.55);
    background:
      radial-gradient(circle at 88% 20%,rgba(157,113,232,.5),transparent 45%),
      linear-gradient(135deg,#0B0720,#25134D);
    color:var(--lightest);padding:6mm 7mm;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .card::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(209,184,255,.18) .8px,transparent .8px);
    background-size:9px 9px;opacity:.6;
  }
  .card > *{position:relative;z-index:1;}
  .top{display:flex;justify-content:space-between;align-items:flex-start;}
  .logo{font-size:13pt;font-weight:800;letter-spacing:.16em;text-shadow:0 0 12px rgba(157,113,232,.8);}
  .logo span{color:var(--glow);}
  .star{width:13mm;height:13mm;filter:drop-shadow(0 0 7px rgba(157,113,232,.9));}
  .name{font-size:15pt;font-weight:700;letter-spacing:.02em;}
  .role{font-size:7.5pt;color:var(--glow);letter-spacing:.16em;text-transform:uppercase;margin-top:1mm;}
  .bottom{border-top:1px solid rgba(157,113,232,.3);padding-top:2mm;font-size:7pt;line-height:1.55;color:var(--light);}
  .bottom strong{color:var(--lightest);}
  @page{size:A4;margin:0;}
  @media print{
    body{background:none;padding:0;}
    .toolbar{display:none;}
    .sheet{box-shadow:none;width:210mm;height:297mm;margin:0;}
  }
</style>
</head>
<body>
  <div class="toolbar">
    <span>NOX Bar · Visitenkarten 85 × 55 mm · 10 Stück auf A4</span>
    <button onclick="window.print()">🖨 Als PDF / Visitenkarten drucken</button>
  </div>

  <div class="sheet" id="sheet"></div>

  <script>
    const star = `
      <svg class="star" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="gradCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F2E9FF"/><stop offset="60%" stop-color="#D1B8FF"/><stop offset="100%" stop-color="#B98BEE"/></linearGradient>
          <filter id="softCard" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.5"/></filter>
        </defs>
        <path d="M50 9 L61 36 L90 38 L68 57 L75 86 L50 70 L25 86 L32 57 L10 38 L39 36 Z" fill="#9D71E8" opacity=".4" filter="url(#softCard)"/>
        <g fill="#F2E9FF" opacity=".85"><circle cx="50" cy="10" r="4"/><circle cx="89" cy="38" r="4"/><circle cx="75" cy="85" r="4"/><circle cx="25" cy="85" r="4"/><circle cx="11" cy="38" r="4"/></g>
        <path d="M16 13 L18 19 L24 21 L18 23 L16 29 L14 23 L8 21 L14 19 Z" fill="#9D71E8" opacity=".85"/>
        <path d="M50 9 L61 36 L90 38 L68 57 L75 86 L50 70 L25 86 L32 57 L10 38 L39 36 Z" fill="url(#gradCard)" stroke="#9D71E8" stroke-width="9" stroke-linejoin="round"/>
        <ellipse cx="39" cy="33" rx="9" ry="4.5" transform="rotate(-25 39 33)" fill="#fff" opacity=".35"/>
        <ellipse cx="41" cy="50" rx="4.8" ry="6.2" fill="#25134D"/><ellipse cx="59" cy="50" rx="4.8" ry="6.2" fill="#25134D"/>
        <circle cx="42.4" cy="47.4" r="1.9" fill="#fff"/><circle cx="60.4" cy="47.4" r="1.9" fill="#fff"/>
        <ellipse cx="30" cy="60" rx="6" ry="3.4" fill="#E39AD9" opacity=".65"/><ellipse cx="70" cy="60" rx="6" ry="3.4" fill="#E39AD9" opacity=".65"/>
        <path d="M45 60 Q50 66 55 60" fill="none" stroke="#25134D" stroke-width="2" stroke-linecap="round"/>
      </svg>`;

    const card = `
      <div class="card">
        <div class="top">
          <div class="logo">NOX<span>.</span>BAR</div>
          ${star}
        </div>
        <div>
          <div class="name">Imran Malik</div>
          <div class="role">Inhaber</div>
        </div>
        <div class="bottom">
          <strong>Kyrenia, Nordzypern</strong><br>
          hello@nox-kyrenia.com · NOX Bar
        </div>
      </div>`;

    document.getElementById("sheet").innerHTML = card.repeat(10);
  </script>
</body>
</html>
