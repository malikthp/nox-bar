<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOX Bar – Getränkekarte</title>
<meta name="description" content="Die komplette Getränkekarte der NOX Bar, Kyrenia – Signature Cocktails, Klassiker, Biere, Weine und Mocktails.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0720;--surface:#25134D;--accent:#6A2FCB;--glow:#9D71E8;
    --light:#D1B8FF;--lightest:#F2E9FF;--gold:#FFD27A;
    --border:rgba(157,113,232,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    background:radial-gradient(ellipse at top,#25134D 0%,#0B0720 65%);
    color:var(--lightest);line-height:1.6;padding:0 0 70px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px;}

  /* Kopfzeile */
  header{text-align:center;padding:64px 22px 30px;}
  .brand{font-family:'Bebas Neue',Impact,'Arial Black',sans-serif;font-size:clamp(3rem,10vw,6.5rem);
    letter-spacing:.1em;color:var(--lightest);text-decoration:none;
    text-shadow:0 0 18px rgba(242,233,255,.5),0 0 50px rgba(157,113,232,.9);}
  .slogan{font-size:1.15rem;color:var(--light);letter-spacing:.06em;margin-top:4px;}
  .slogan em{color:var(--glow);}
  .rule{width:90px;height:2px;background:var(--glow);box-shadow:0 0 14px var(--glow);margin:22px auto;}

  .toolbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 38px;}
  .toolbar button{
    background:rgba(157,113,232,.1);border:1px solid var(--border);color:var(--light);
    border-radius:999px;padding:9px 18px;font:inherit;font-size:.85rem;cursor:pointer;transition:.2s;
  }
  .toolbar button:hover,.toolbar button.active{background:rgba(157,113,232,.3);border-color:var(--glow);color:var(--lightest);}

  /* Kategorien */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:22px;}
  .category{
    background:linear-gradient(150deg,rgba(37,19,77,.85),rgba(11,7,32,.9));
    border:1px solid var(--border);border-radius:16px;padding:28px;
    box-shadow:0 0 35px rgba(106,47,203,.18);break-inside:avoid;
  }
  .category h2{
    font-family:'DM Sans',Arial,sans-serif;font-size:1.75rem;font-weight:300;
    letter-spacing:.14em;text-transform:uppercase;
    color:#FFE7B0;
    text-shadow:
      0 0 5px rgba(255,230,175,.55),
      0 0 14px rgba(255,215,138,.4),
      0 0 28px rgba(157,113,232,.35),
      0 1px 2px rgba(0,0,0,.45);
    padding-bottom:12px;margin-bottom:8px;
    border-bottom:1px solid rgba(255,215,138,.55);
  }
  .item{padding:13px 0;border-bottom:1px dashed rgba(157,113,232,.16);}
  .item:last-child{border-bottom:none;}
  .item-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
  .item-name{font-size:1.02rem;font-weight:600;color:var(--lightest);letter-spacing:.01em;}
  .price{color:var(--glow);font-weight:700;white-space:nowrap;}
  .item-desc{font-size:.82rem;color:var(--light);opacity:.82;margin-top:3px;}
  .tag{display:inline-block;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--bg);background:var(--gold);border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:middle;}

  /* Fußzeile */
  footer{text-align:center;margin-top:650px;padding:40px 0 20px;border-top:1px solid var(--border);
    color:var(--light);font-size:.9rem;line-height:2.1;}
  footer strong{color:var(--lightest);}
  .footer-main{display:flex;align-items:center;justify-content:center;gap:18px;text-align:left;}
  .footer-noxi{width:56px;height:56px;flex:0 0 56px;display:block;margin:0;
    filter:drop-shadow(0 0 8px rgba(157,113,232,.6));}
  .hint{text-align:center;color:var(--light);opacity:.55;font-size:.75rem;margin-top:14px;}

  @media print{
    body{background:#fff;color:#1a1a1a;padding:0;}
    .wrap{max-width:none;padding:0;}
    header{padding:0 0 14px;}
    .brand{color:#2A1454;text-shadow:none;font-size:34pt;}
    .slogan{color:#4A2A7A;}.rule{background:#6A2FCB;box-shadow:none;margin:8px auto;}
    .toolbar,.hint{display:none;}
    .grid{display:block;columns:2;column-gap:18px;}
    .category{background:none;border:none;border-top:2px solid #6A2FCB;border-radius:0;
      box-shadow:none;padding:10px 0;margin:0 0 14px;break-inside:avoid;}
    .category h2{color:#5A2A9A;text-shadow:none;font-size:15pt;}
    .item-name{color:#1a1a1a;}.item-desc{color:#444;opacity:1;}
    .price{color:#5A2A9A;}.item{border-bottom:1px solid #ddd;}
    footer{color:#444;border-color:#ccc;}footer strong{color:#1a1a1a;}
    @page{size:A4;margin:14mm;}
  }
</style>
</head>
<body>

<header class="wrap">
  <a href="index.html" class="brand">NOX BAR</a>
  <div class="slogan" data-t="slogan">Die Nacht gehört dir. · <em>Own the night.</em></div>
  <div class="rule"></div>
  <div class="toolbar">
    <button data-lang="de" class="active">DE</button>
    <button data-lang="en">EN</button>
    <button data-lang="tr">TR</button>
    <button data-lang="ru">RU</button>
    <button onclick="window.print()">🖨 Drucken / PDF</button>
  </div>
</header>

<main class="wrap">
  <div class="grid" id="menu"></div>
</main>

<footer class="wrap">
  <div class="footer-main">
    <svg class="footer-noxi" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="gradFooter" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F2E9FF"/><stop offset="60%" stop-color="#D1B8FF"/><stop offset="100%" stop-color="#B98BEE"/></linearGradient>
        <filter id="softFooter" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.5"/></filter>
      </defs>
      <path d="M50 9 L61 36 L90 38 L68 57 L75 86 L50 70 L25 86 L32 57 L10 38 L39 36 Z" fill="#9D71E8" opacity=".4" filter="url(#softFooter)"/>
      <g fill="#F2E9FF" opacity=".85"><circle cx="50" cy="10" r="4"/><circle cx="89" cy="38" r="4"/><circle cx="75" cy="85" r="4"/><circle cx="25" cy="85" r="4"/><circle cx="11" cy="38" r="4"/></g>
      <path d="M16 13 L18 19 L24 21 L18 23 L16 29 L14 23 L8 21 L14 19 Z" fill="#9D71E8" opacity=".85"/>
      <path d="M50 9 L61 36 L90 38 L68 57 L75 86 L50 70 L25 86 L32 57 L10 38 L39 36 Z" fill="url(#gradFooter)" stroke="#9D71E8" stroke-width="9" stroke-linejoin="round"/>
      <ellipse cx="39" cy="33" rx="9" ry="4.5" transform="rotate(-25 39 33)" fill="#fff" opacity=".35"/>
      <ellipse cx="41" cy="50" rx="4.8" ry="6.2" fill="#25134D"/><ellipse cx="59" cy="50" rx="4.8" ry="6.2" fill="#25134D"/>
      <circle cx="42.4" cy="47.4" r="1.9" fill="#fff"/><circle cx="60.4" cy="47.4" r="1.9" fill="#fff"/>
      <ellipse cx="30" cy="60" rx="6" ry="3.4" fill="#E39AD9" opacity=".65"/><ellipse cx="70" cy="60" rx="6" ry="3.4" fill="#E39AD9" opacity=".65"/>
      <path d="M45 60 Q50 66 55 60" fill="none" stroke="#25134D" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div>
      <strong>NOX BAR</strong> · Kyrenia, Nordzypern<br>
      <span data-t="hours">Täglich 17:00 – 05:00 Uhr</span> ·
      <a href="mailto:hello@nox-kyrenia.com" style="color:var(--glow)">hello@nox-kyrenia.com</a><br>
      <span data-t="owner">Inhaber: Imran Malik</span>
    </div>
  </div>
  <p class="hint" data-t="hint">Preise sind Beispielwerte – bitte vor Veröffentlichung anpassen.</p>
</footer>

<script src="assets/nox-menu.js"></script>
<script>
const MENU = NOX_MENU;
const STATIC = NOX_MENU_STATIC;

let lang=localStorage.getItem('nox_menu_lang')||'de';

function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const v=STATIC[el.dataset.t]; if(v) el.innerHTML=v[lang]||v.de;
  });
  document.querySelectorAll('.toolbar [data-lang]').forEach(b=>
    b.classList.toggle('active',b.dataset.lang===lang));

  document.getElementById('menu').innerHTML=MENU.map(cat=>`
    <section class="category">
      <h2>${cat.title[lang]||cat.title.de}</h2>
      ${cat.items.map(i=>`
        <div class="item">
          <div class="item-top">
            <span class="item-name">${i.name}${i.badge?`<span class="tag">${i.badge}</span>`:''}</span>
            <span class="price">€ ${i.price}</span>
          </div>
          <div class="item-desc">${i.desc[lang]||i.desc.de}</div>
        </div>`).join('')}
    </section>`).join('');
}

document.querySelectorAll('.toolbar [data-lang]').forEach(b=>
  b.addEventListener('click',()=>{
    lang=b.dataset.lang;
    localStorage.setItem('nox_menu_lang',lang);
    render();
  }));

render();
</script>
</body>
</html>
