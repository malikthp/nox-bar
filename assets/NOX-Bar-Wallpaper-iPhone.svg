<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1179 2556" width="1179" height="2556" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="85%">
      <stop offset="0%"   stop-color="#2C1759"/>
      <stop offset="45%"  stop-color="#150B33"/>
      <stop offset="100%" stop-color="#0B0720"/>
    </radialGradient>
    <pattern id="stars" width="92" height="92" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1.2" fill="#D1B8FF" opacity=".3"/>
      <circle cx="64" cy="52" r="0.9" fill="#9D71E8" opacity=".35"/>
      <circle cx="35" cy="80" r="1.0" fill="#F2E9FF" opacity=".22"/>
      <circle cx="85" cy="10" r="0.7" fill="#D1B8FF" opacity=".25"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="42%" r="72%">
      <stop offset="55%"  stop-color="#0B0720" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05030F" stop-opacity=".8"/>
    </radialGradient>
    <filter id="glowBig" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="glowMid" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <linearGradient id="noxiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2E9FF"/><stop offset="60%" stop-color="#D1B8FF"/><stop offset="100%" stop-color="#B98BEE"/>
    </linearGradient>
  </defs>

  <rect width="1179" height="2556" fill="url(#bg)"/>
  <rect width="1179" height="2556" fill="url(#stars)"/>

  <!-- Kleine Sterne / Funkelextrate -->
  <g fill="#D1B8FF" opacity=".6">
    <circle cx="150" cy="420" r="1.8"/><circle cx="1020" cy="360" r="1.5"/>
    <circle cx="240" cy="1180" r="1.6"/><circle cx="960" cy="1320" r="1.7"/>
    <circle cx="120" cy="1850" r="1.4"/><circle cx="1060" cy="2020" r="1.6"/>
  </g>

  <g text-anchor="middle">
    <text x="589" y="1060" font-family="'Bebas Neue',Impact,'Arial Black',sans-serif"
          font-size="170" letter-spacing="8" fill="#6A2FCB" filter="url(#glowBig)" opacity=".85">NOX BAR</text>
    <text x="589" y="1060" font-family="'Bebas Neue',Impact,'Arial Black',sans-serif"
          font-size="170" letter-spacing="8" fill="#9D71E8" filter="url(#glowMid)" opacity=".9">NOX BAR</text>
    <text x="589" y="1060" font-family="'Bebas Neue',Impact,'Arial Black',sans-serif"
          font-size="170" letter-spacing="8" fill="#F2E9FF">NOX BAR</text>

    <line x1="330" y1="1150" x2="848" y2="1150" stroke="#9D71E8" stroke-width="2" opacity=".8"/>
    <circle cx="589" cy="1150" r="5" fill="#9D71E8"/>

    <text x="589" y="1300" font-family="'DM Sans',Arial,sans-serif" font-size="54"
          letter-spacing="4" fill="#D1B8FF">DIE NACHT</text>
    <text x="589" y="1370" font-family="'DM Sans',Arial,sans-serif" font-size="54"
          letter-spacing="4" fill="#D1B8FF">GEHÖRT DIR.</text>
    <text x="589" y="1470" font-family="'DM Sans',Arial,sans-serif" font-size="38"
          font-style="italic" letter-spacing="3" fill="#D1B8FF" opacity=".85">Own the night.</text>
  </g>

  <!-- Noxi unten klein -->
  <g transform="translate(589,2440) scale(1.05) translate(-50,-50)">
    <path d="M50 9 L61 36 L90 38 L68 57 L75 86 L50 70 L25 86 L32 57 L10 38 L39 36 Z"
          fill="#9D71E8" opacity=".35" filter="url(#glowMid)"/>
    <g fill="#F2E9FF" opacity=".8">
      <circle cx="50" cy="10" r="4"/><circle cx="89" cy="38" r="4"/><circle cx="75" cy="85" r="4"/>
      <circle cx="25" cy="85" r="4"/><circle cx="11" cy="38" r="4"/>
    </g>
    <path d="M16 13 L18 19 L24 21 L18 23 L16 29 L14 23 L8 21 L14 19 Z" fill="#9D71E8" opacity=".8"/>
    <path d="M50 9 L61 36 L90 38 L68 57 L75 86 L50 70 L25 86 L32 57 L10 38 L39 36 Z"
          fill="url(#noxiGrad)" stroke="#9D71E8" stroke-width="9" stroke-linejoin="round"/>
    <ellipse cx="41" cy="50" rx="4.8" ry="6.2" fill="#25134D"/><ellipse cx="59" cy="50" rx="4.8" ry="6.2" fill="#25134D"/>
    <circle cx="42.4" cy="47.4" r="1.9" fill="#fff"/><circle cx="60.4" cy="47.4" r="1.9" fill="#fff"/>
    <ellipse cx="30" cy="60" rx="6" ry="3.4" fill="#E39AD9" opacity=".65"/><ellipse cx="70" cy="60" rx="6" ry="3.4" fill="#E39AD9" opacity=".65"/>
    <path d="M45 60 Q50 66 55 60" fill="none" stroke="#25134D" stroke-width="2" stroke-linecap="round"/>
  </g>

  <rect width="1179" height="2556" fill="url(#vignette)"/>
</svg>
