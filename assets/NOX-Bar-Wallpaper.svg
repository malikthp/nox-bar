<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Tiefer Nacht-Hintergrund -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0B0720"/>
      <stop offset="45%"  stop-color="#150B33"/>
      <stop offset="75%"  stop-color="#25134D"/>
      <stop offset="100%" stop-color="#0B0720"/>
    </linearGradient>

    <!-- Weiche Lichtquellen -->
    <radialGradient id="glowViolet">
      <stop offset="0%"   stop-color="#6A2FCB" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#6A2FCB" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6A2FCB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowLavender">
      <stop offset="0%"   stop-color="#9D71E8" stop-opacity="0.42"/>
      <stop offset="60%"  stop-color="#9D71E8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#9D71E8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPale">
      <stop offset="0%"   stop-color="#D1B8FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D1B8FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Feine Punkt-Struktur -->
    <pattern id="dots" width="110" height="110" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="22" r="1.6" fill="#D1B8FF" opacity="0.28"/>
      <circle cx="76" cy="61" r="1.1" fill="#9D71E8" opacity="0.34"/>
      <circle cx="42" cy="94" r="1.3" fill="#F2E9FF" opacity="0.20"/>
      <circle cx="102" cy="13" r="0.9" fill="#D1B8FF" opacity="0.22"/>
    </pattern>

    <pattern id="fineDots" width="47" height="47" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="12" r="0.7" fill="#F2E9FF" opacity="0.16"/>
      <circle cx="33" cy="38" r="0.6" fill="#9D71E8" opacity="0.20"/>
    </pattern>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="55%"  stop-color="#0B0720" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05030F" stop-opacity="0.75"/>
    </radialGradient>

    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9D71E8" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#9D71E8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#9D71E8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Basis -->
  <rect width="3840" height="2160" fill="url(#bg)"/>

  <!-- Große Glow-Flächen -->
  <ellipse cx="950" cy="430" rx="1500" ry="1150" fill="url(#glowViolet)"/>
  <ellipse cx="3050" cy="1650" rx="1450" ry="1050" fill="url(#glowLavender)"/>
  <ellipse cx="2100" cy="980" rx="1150" ry="850" fill="url(#glowPale)" opacity="0.5"/>

  <!-- Sanfte Lichtbänder -->
  <g transform="rotate(-18 1920 1080)">
    <rect x="-400" y="470" width="4640" height="120" fill="url(#streak)"/>
    <rect x="-400" y="1460" width="4640" height="70" fill="url(#streak)" opacity="0.6"/>
  </g>

  <!-- Punkt-Ebenen -->
  <rect width="3840" height="2160" fill="url(#dots)"/>
  <rect width="3840" height="2160" fill="url(#fineDots)"/>

  <!-- Größere, weiche Bokeh-Punkte -->
  <g fill="url(#glowLavender)">
    <circle cx="580" cy="1580" r="180"/>
    <circle cx="3320" cy="420" r="220"/>
    <circle cx="1700" cy="320" r="130"/>
    <circle cx="2580" cy="1880" r="150"/>
  </g>
  <g fill="#D1B8FF">
    <circle cx="1180" cy="760" r="4" opacity="0.55"/>
    <circle cx="2240" cy="1320" r="5" opacity="0.45"/>
    <circle cx="2980" cy="980" r="3.5" opacity="0.5"/>
    <circle cx="760" cy="380" r="3" opacity="0.45"/>
    <circle cx="3560" cy="1320" r="4" opacity="0.4"/>
  </g>

  <!-- Vignette zum Rand hin -->
  <rect width="3840" height="2160" fill="url(#vignette)"/>
</svg>
