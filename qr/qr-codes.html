<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOX Bar – QR Codes</title>
<style>
  :root{--bg:#0B0720;--surface:#25134D;--glow:#9D71E8;--lightest:#F2E9FF;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',Arial,sans-serif;background:radial-gradient(ellipse at top,var(--surface),var(--bg) 65%);color:var(--lightest);padding:50px 20px;text-align:center;}
  h1{font-size:2rem;letter-spacing:.2em;text-shadow:0 0 20px var(--glow);margin-bottom:30px;}
  h1 a{color:inherit;text-decoration:none;transition:text-shadow .2s ease;}
  h1 a:hover{text-shadow:0 0 30px var(--glow),0 0 60px var(--glow);}
  .grid{display:flex;gap:34px;justify-content:center;flex-wrap:wrap;max-width:1000px;margin:0 auto;}
  .qr img{width:270px;height:270px;border-radius:12px;background:var(--lightest);display:block;}
  button{margin-top:34px;background:linear-gradient(135deg,#6A2FCB,#9D71E8);color:#fff;border:none;border-radius:999px;padding:12px 26px;font:inherit;font-weight:600;cursor:pointer;}
  @media print{
    body{background:#fff;padding:10px;}
    h1{color:#2A1454;text-shadow:none;}
    button{display:none;}
    @page{size:A4 landscape;margin:14mm;}
  }
</style>
</head>
<body>
  <h1><a href="https://nox-bar.onrender.com/">NOX BAR</a></h1>

  <div class="grid">
    <img src="QR-Homepage.png" alt="QR Homepage">
    <img src="QR-Getraenkekarte.png" alt="QR Getränkekarte">
    <img src="QR-Speisekarte.png" alt="QR Speisekarte">
  </div>

  <button onclick="window.print()">🖨 QR-Bogen drucken</button>
</body>
</html>
